name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The password vault (src/neat/vault) uses nothing of WinUI, so it has its own plain
      # self-check (tests/vault.check, no test packages). It runs here, on Windows, so the real
      # DPAPI is checked too, and a failure stops the build before the long WinUI build starts.
      - name: Vault self-check
        run: dotnet run --project tests/vault.check --configuration Release

      # The two scripts that run inside web pages (src/neat/pass/capture.cs, which watches login
      # forms, and src/neat/pass/fill.cs, which fills them) are JavaScript, so they are checked
      # against made-up login pages with jsdom (tests/capture.check). The only package is
      # that test tool; nothing from it ends up in the app.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Page script self-check
        working-directory: tests/capture.check
        run: |
          npm ci --no-audit --no-fund
          node check.js
          node check-fill.js

      - name: Restore
        run: dotnet restore src/neat/neat.csproj -p:Platform=x64

      - name: Build
        run: dotnet build src/neat/neat.csproj --configuration Release --no-restore -p:Platform=x64

      # Produces a plain folder with neat.exe that runs on its own
      # (self-contained, unpackaged, with the bundled WebView2 runtime).
      - name: Publish
        run: dotnet publish src/neat/neat.csproj --configuration Release --no-build -p:Platform=x64 --output publish

      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: neat-win-x64
          path: publish
          retention-days: 7
